<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color"
      content="#0d6efd">

      
    <title>{% block title %}CableQIMS{% endblock %}</title>

    <!--manifest-->
    <link rel="manifest"
      href="{{ url_for('static', filename='manifest.json') }}">

    
    <link rel="apple-touch-icon"
      href="{{ url_for('static', filename='icons/cableqims.png') }}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/buttons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet"href="{{ url_for('static', filename='css/reports.css') }}">

</head>



<body class="{{ current_user.theme }}">

<div class="wrapper">

    <!-- Sidebar -->
    {% include 'partials/sidebar.html' %}

    <!-- Main Page -->
    <div class="page flex-grow-1">

        <!-- Navbar -->
        {% include 'partials/navbar.html' %}

        <!-- Flash Messages -->
        <div class="container-fluid mt-3">
            {% include 'partials/flash_messages.html' %}
        </div>

        <!-- Main Content -->
        <main class="container-fluid py-4">

            {% block content %}
            {% endblock %}

        </main>

        <!-- Footer -->
        {% include 'partials/footer.html' %}

    </div>

</div>
<div class="sidebar-overlay"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Custom JS -->
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>

<script>
(function () {

    let savedTheme = "{{ current_user.theme if current_user.is_authenticated else 'system' }}";

    function applyTheme(theme) {

        if (theme === "system") {

            const prefersDark = window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches;

            document.documentElement.setAttribute(
                "data-bs-theme",
                prefersDark ? "dark" : "light"
            );

        } else {

            document.documentElement.setAttribute(
                "data-bs-theme",
                theme
            );

        }

    }

    applyTheme(savedTheme);

    // Automatically update if the user changes Windows/macOS theme
    window.matchMedia("(prefers-color-scheme: dark)")
        .addEventListener("change", function () {

            if (savedTheme === "system") {
                applyTheme("system");
            }

        });

})();
</script>

<script>
if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register(
        "/static/sw.js"
    );

}
</script>

<!-- Page Specific Scripts -->
{% block scripts %}
{% endblock %}



</body>

</html>

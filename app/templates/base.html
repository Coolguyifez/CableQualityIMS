<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color"
      content="#0d6efd">

      
    <title>{% block title %}CableQIMS{% endblock %}</title>

    <!--logo-->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/cableqims.png') }}">

    <!--manifest-->
    <link rel="manifest"
      href="{{ url_for('static', filename='manifest.json') }}">

    
    <link rel="apple-touch-icon"
      href="{{ url_for('static', filename='icons/cableqims.png') }}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/buttons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet"href="{{ url_for('static', filename='css/reports.css') }}">
<script>
(function () {

    const serverTheme =
        "{{ current_user.theme if current_user.is_authenticated else '' }}";

    const storedTheme =
        localStorage.getItem("cqims-theme");

    /*
     * The saved QIMS preference has priority.
     *
     * If the logged-in user has a saved preference,
     * use that. Otherwise use localStorage.
     */
    const selectedTheme =
        serverTheme || storedTheme || "system";


    /*
     * Get the actual operating-system theme.
     */
    function getSystemTheme() {

        return window.matchMedia(
            "(prefers-color-scheme: dark)"
        ).matches
            ? "dark"
            : "light";

    }


    /*
     * Apply the theme everywhere.
     */
    function applyCQIMSTheme(theme) {

        const actualTheme =
            theme === "system"
                ? getSystemTheme()
                : theme;


        /*
         * HTML / Bootstrap theme
         */
        document.documentElement.setAttribute(
            "data-bs-theme",
            actualTheme
        );


        /*
         * Store the user's preference.
         *
         * IMPORTANT:
         * Store "system", "light", or "dark".
         * Never replace "system" with "light"/"dark".
         */
        localStorage.setItem(
            "cqims-theme",
            theme
        );


        /*
         * Store both the selected theme
         * and the resolved theme.
         */
        document.documentElement.setAttribute(
            "data-cqims-theme",
            theme
        );

        document.documentElement.setAttribute(
            "data-cqims-actual-theme",
            actualTheme
        );


        /*
         * Body may not exist yet because this script
         * is located in <head>.
         *
         * Therefore we safely wait for it.
         */
        function updateBody() {

            if (!document.body) {
                return;
            }

            document.body.classList.remove(
                "light",
                "dark",
                "system"
            );

            document.body.classList.add(
                actualTheme
            );


            /*
             * Additional classes that make it easier
             * for your existing CSS to react.
             */
            document.body.classList.toggle(
                "light-mode",
                actualTheme === "light"
            );

            document.body.classList.toggle(
                "dark-mode",
                actualTheme === "dark"
            );

        }


        if (document.body) {

            updateBody();

        } else {

            document.addEventListener(
                "DOMContentLoaded",
                updateBody,
                { once: true }
            );

        }

    }


    /*
     * Make the function available to app.js
     */
    window.applyCQIMSTheme =
        applyCQIMSTheme;


    /*
     * Apply initial theme.
     */
    applyCQIMSTheme(
        selectedTheme
    );


    /*
     * Watch the operating-system theme.
     */
    const mediaQuery =
        window.matchMedia(
            "(prefers-color-scheme: dark)"
        );


    mediaQuery.addEventListener(
        "change",
        function () {

            const currentTheme =
                localStorage.getItem(
                    "cqims-theme"
                ) || selectedTheme;


            /*
             * Only follow the OS when QIMS
             * is actually set to SYSTEM.
             */
            if (currentTheme === "system") {

                applyCQIMSTheme("system");

            }

        }
    );


})();
</script>

</head>



<body>
<div class="wrapper">

    <!-- Sidebar -->
    {% include 'partials/sidebar.html' %}

    <!-- Main Page -->
    <div class="page flex-grow-1">

        <!-- Navbar -->
        {% include 'partials/navbar.html' %}

        <!-- Flash Messages -->
        <div class="container-fluid mt-3">
            {% include 'partials/flash_messages.html' %}
        </div>

        <!-- Main Content -->
        <main class="container-fluid py-4">

            {% block content %}
            {% endblock %}

        </main>

        

    </div>

</div>
<div class="sidebar-overlay"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Custom JS -->
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
<script src="{{ url_for('static', filename='js/service-worker.js') }}"></script>



<script>
if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register(
        "/static/sw.js"
    );

}
</script>

<!-- Page Specific Scripts -->
{% block scripts %}
{% endblock %}



</body>

</html>

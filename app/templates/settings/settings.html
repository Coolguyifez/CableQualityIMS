{% extends "base.html" %}

{% block title %}
Settings
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            <i class="bi bi-gear"></i>
            Settings
        </h2>

    </div>

    <div class="row g-4">

        <!-- Appearance -->

        <div class="col-md-6 col-xl-3">

            <div class="card shadow-sm h-100">

                <div class="card-body text-center">

                    <i class="bi bi-palette display-4 text-primary"></i>

                    <h5 class="mt-3">

                        Appearance

                    </h5>

                    <p class="text-muted">

                        Theme & display preferences

                    </p>

                    <a href="{{ url_for('main.appearance_settings') }}"
                       class="btn btn-outline-primary">

                        Manage

                    </a>

                </div>

            </div>

        </div>

        <!-- Account -->

        <div class="col-md-6 col-xl-3">

            <div class="card shadow-sm h-100">

                <div class="card-body text-center">

                    <i class="bi bi-person-circle display-4 text-success"></i>

                    <h5 class="mt-3">

                        Account

                    </h5>

                    <p class="text-muted">

                        Profile information

                    </p>

                    <a href="{{ url_for('main.account_settings') }}"
                       class="btn btn-outline-success">

                        Manage

                    </a>

                </div>

            </div>

        </div>

        <!-- Password -->

        <div class="col-md-6 col-xl-3">

            <div class="card shadow-sm h-100">

                <div class="card-body text-center">

                    <i class="bi bi-shield-lock display-4 text-warning"></i>

                    <h5 class="mt-3">

                        Security

                    </h5>

                    <p class="text-muted">

                        Change your password

                    </p>

                    <a href="{{ url_for('main.password_settings') }}"
                       class="btn btn-outline-warning">

                        Manage

                    </a>

                </div>

            </div>

        </div>

        <!-- Notifications -->

        <div class="col-md-6 col-xl-3">

            <div class="card shadow-sm h-100">

                <div class="card-body text-center">

                    <i class="bi bi-bell display-4 text-danger"></i>

                    <h5 class="mt-3">

                        Notifications

                    </h5>

                    <p class="text-muted">

                        Alerts & sounds

                    </p>

                    <a href="{{ url_for('main.notification_settings') }}"
                       class="btn btn-outline-danger">

                        Manage

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

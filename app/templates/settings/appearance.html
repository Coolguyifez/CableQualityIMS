{% extends "base.html" %}

{% block title %}
Appearance Settings
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow-sm">

                <div class="card-header">

                    <h4 class="mb-0">
                        <i class="bi bi-palette"></i>
                        Appearance
                    </h4>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {{ form.hidden_tag() }}

                        <div class="mb-4">

                            {{ form.theme.label(class="form-label fw-semibold") }}

                            {{ form.theme(class="form-select") }}

                        </div>

                        <div class="d-flex justify-content-between">

                        <a href="{{ url_for('main.settings') }}"
                        class="btn btn-secondary">
                        
                        
                        Cancel
                        
                        </a>
                        {{ form.submit(class="btn btn-primary") }}
                        
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

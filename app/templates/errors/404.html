{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}

<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-5">

    <div class="text-center" style="max-width: 600px;">

        <div class="mb-4">
            <div
                class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary bg-opacity-10"
                style="width: 100px; height: 100px;"
            >
                <i class="bi bi-compass text-primary"
                   style="font-size: 3rem;"></i>
            </div>
        </div>

        <h1 class="display-3 fw-bold mb-2">
            404
        </h1>

        <h2 class="fw-semibold mb-3">
            Page Not Found
        </h2>

        <p class="text-muted fs-5 mb-4">
            The page you are looking for doesn't exist, may have been
            moved, or is no longer available.
        </p>

        <div class="d-flex justify-content-center gap-2">

            <a
                href="{{ url_for('main.home') }}"
                class="btn btn-primary px-4"
            >
                <i class="bi bi-house me-1"></i>
                Return to Dashboard
            </a>

            <button
                type="button"
                class="btn btn-outline-secondary px-4"
                onclick="history.back();"
            >
                <i class="bi bi-arrow-left me-1"></i>
                Go Back
            </button>

        </div>

        <p class="text-muted small mt-4">
            CableQIMS
        </p>

    </div>

</div>

{% endblock %}

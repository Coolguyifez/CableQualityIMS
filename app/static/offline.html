<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
      


    <title>You're Offline</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f8fafc;
            color: #0f172a;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }


        .offline-container {

            width: 100%;
            max-width: 520px;

            text-align: center;

            padding: 40px 30px;

            
            transition:
                background 0.25s ease,
                box-shadow 0.25s ease;
        }




        h1 {

            margin: 0 0 12px;

            font-size: 28px;

            font-weight: 700;

        }


        p {

            margin: 0 auto 24px;

            max-width: 420px;

            font-size: 15px;

            line-height: 1.7;

            color: #64748b;

        }


        .retry-button {

            border: none;

            padding: 11px 22px;

            border-radius: 8px;

            background: #0c60de;

            color: #ffffff;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;

        }


        .retry-button:hover {

            opacity: 0.9;

            transform: translateY(-1px);

        }


        .status {

            margin-top: 18px;

            font-size: 12px;

            color: #94a3b8;

        }


        /*
         * DARK THEME
         */

        @media (prefers-color-scheme: dark) {

            body {

                background: #103895;

                color: #f8fafc;

            }


            p {

                color: #94a3b8;

            }


            .status {

                color: #64748b;

            }

        }


        /*
         * MOBILE
         */

        @media (max-width: 576px) {

            .offline-container {

                padding: 32px 22px;

            }


            h1 {

                font-size: 24px;

            }

        }

    </style>

</head>


<body>

    <div class="offline-container">

       <div
                class="d-inline-flex align-items-center justify-content-center rounded-circle bg-warning bg-opacity-10"
                style="width: 100px; height: 100px;"
            >
                <i class="bi bi-wifi-off text-warning"
                   style="font-size: 3rem;"></i>
            </div>

            <br><br>
        <h1>
            You're Offline
        </h1>


        <p>
            CableQIMS is currently unable to connect
            to the server. Please check your internet
            connection and try again.
        </p>


        <button
            class="retry-button"
            onclick="window.location.reload()"
        >

        <i class="bi bi-arrow-clockwise"></i>
            Try Again
        </button>


        <div class="status">
            CableQIMS • Connection unavailable
        </div>

    </div>


    <script>

        /*
         * Automatically reload when
         * the internet connection returns.
         */

        window.addEventListener(
            "online",
            function () {

                window.location.reload();

            }
        );

    </script>

</body>

</html>
